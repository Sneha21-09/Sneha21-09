<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Connect with Sneha Singh</title><desc id="desc">A simple contact panel linking to Sneha Singh’s public GitHub profile. Other public contact links can be added later when supplied.</desc><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100E1A"/><stop offset=".55" stop-color="#1C1428"/><stop offset="1" stop-color="#111222"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#FF8FC8"/><stop offset=".52" stop-color="#A78BFA"/><stop offset="1" stop-color="#FFD66B"/></linearGradient>
 <linearGradient id="lanyard" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF8FC8"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#FFD66B"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2B203C"/><stop offset="1" stop-color="#171426"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF8FC8" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#F7B9DC" opacity=".15"/></pattern>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
<rect width="1200" height="260" rx="28" fill="url(#bg)"/><rect width="1200" height="260" rx="28" fill="url(#dots)"/><rect x="2" y="2" width="1196" height="256" rx="26" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="58" y="60" fill="#FF8FC8" font-family="monospace" font-size="14" font-weight="700" letter-spacing="2.5">OPEN CHANNEL  /  COLLABORATION</text><text x="58" y="112" fill="#FFF3FA" font-family="Arial,sans-serif" font-size="37" font-weight="700" >Let’s build something</text><text x="58" y="151" fill="#A78BFA" font-family="Arial,sans-serif" font-size="24" font-weight="700" >curious, useful and a little bit waku waku.</text><text x="58" y="205" fill="#A99AB8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.3">MORE PUBLIC LINKS CAN BE ADDED WHEN SNEHA SHARES THEM.</text><g transform="translate(865 55)"><rect width="275" height="145" rx="22" fill="#211A34" stroke="#FF8FC8" stroke-width="2"/><circle cx="58" cy="72" r="34" fill="#2B203C" stroke="#FFD66B" stroke-width="2"/><path d="M43 71 L54 82 L75 58" fill="none" stroke="#FFD66B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="67" fill="#FFF3FA" font-family="Arial" font-size="20" font-weight="700">GITHUB</text><text x="112" y="95" fill="#D6C9E0" font-family="Arial" font-size="16">@Sneha21-09</text></g></svg>