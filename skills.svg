<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Sneha Singh — Skill Constellation</title><desc id="desc">A visual map of technologies evidenced by Sneha Singh public repository descriptions and language labels.</desc>
